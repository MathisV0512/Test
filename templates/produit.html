<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.0.0-beta3/css/all.css" >
    <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}">
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <title>LucasPhoto29</title>
</head>
<body>
    <nav>
        <div class="logo-titre">
            <a href="/"><img src="{{ url_for('static', filename='img/logo.png') }}" alt="logo"></a>
            <h1>LucasPhoto29</h1>
        </div>
        <div class="onglets">
            <p class="link"><a href="{{ url_for('about') }}">À propos</a></p>
            <p class="link"><a href="{{ url_for('contact') }}">Contact</a></p>
            <p class="link"><a href="{{ url_for('boutique') }}">Boutique</a></p>
            <p class="link"><a href="{{ url_for('commentaire') }}">Avis</a></p>
            <form>
                <input type="search" placeholder="Rechercher..." id="search">   
            </form>
            <p><i class="fa-solid fa-cart-shopping"></i></p>
        </div>
    </nav>

    <div class="product-page">
        <div class="product-image">
            <img src="{{ url_for('static', filename='img/' + produit.filename) }}" alt="{{ produit.title }}">
        </div>

        <div class="product-details">
            <h1>{{ produit.title }}</h1>
            <p class="product-price">{{ produit.price }} €</p>
            <button class="btn-ajouter">Ajouter au panier</button>

            <button class="accordion">Description <i class="fa-solid fa-arrow-down"></i></button>
            <div class="panel">
                <p>{{ produit.description }}</p>
            </div>

            <p><a href="{{ url_for('boutique') }}">← Retour à la boutique</a></p>
        </div>
    </div>

    <footer>
        <p>© 2023 Mon Site. Tous droits réservés.</p>
    </footer>
</body>
</html>
